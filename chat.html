/*

    Botti muistaa esimerkiksi:
    - puhuttiinko lapsesta, nuoresta, työikäisestä tai ikääntyneestä
    - puhuttiinko mielenterveydestä, terveyspalveluista tai lomakkeesta

*/

/* =========================================================
   AIKA
========================================================= */

function getTime(){

    return new Intl.DateTimeFormat(
        'fi-FI',
        {
            hour:'2-digit',
            minute:'2-digit'
        }
    ).format(new Date());

}


/* =========================================================
   VIESTIN LISÄÄMINEN
========================================================= */

function addMessage(
    text,
    type='bot'
){

    const message =
        document.createElement('div');

    message.className =
        'message ' + type;

    const inner =
        document.createElement('div');

    inner.className =
        'message-inner';

    const name =
        document.createElement('div');

    name.className =
        'message-name';

    name.textContent =
        type === 'user'
            ? 'Sinä'
            : 'Digitaalinen palveluohjaus';

    const bubble =
        document.createElement('div');

    bubble.className =
        'message-bubble';

    bubble.textContent =
        text;

    const time =
        document.createElement('div');

    time.className =
        'message-time';

    time.textContent =
        getTime();

    inner.appendChild(name);
    inner.appendChild(bubble);
    inner.appendChild(time);

    message.appendChild(inner);

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

    return bubble;

}

   BOTIN KÄYNNISTYS

    if(botStarted){
        return;
    }

    botStarted = true;

    addMessage(

}

/* =========================================================
   TEKSTIN NORMALISOINTI
========================================================= */

function normalize(text){

    return String(text || '')
        .toLocaleLowerCase('fi')
        .normalize('NFD')
        .replace(
            /[\u0300-\u036f]/g,
            ''
        )
        .replace(/[.,!?;:()[\]{}"'´`]/g,' ')
        .replace(/\s+/g,' ')
        .trim();

}


/* =========================================================
   SANAT JA SAMANKALTAISUUS
========================================================= */

function words(text){

    return normalize(text)
        .split(' ')
        .filter(Boolean);

}


function contains(text, searchWords){

    const normalized =
        normalize(text);

    return searchWords.some(
        word =>
            normalized.includes(
                normalize(word)
            )
    );

}


/*
    Levenshtein-etäisyys.

    Tämän ansiosta botti ymmärtää myös pieniä
    kirjoitusvirheitä kuten:

    mielenterveydesä
    terveysasemaaa
    nuorelle
    lomaketta
*/

function levenshtein(a,b){

    a = normalize(a);
    b = normalize(b);

    if(a === b){
        return 0;
    }

    if(!a.length){
        return b.length;
    }

    if(!b.length){
        return a.length;
    }

    const matrix = [];

    for(let i = 0; i <= b.length; i++){
        matrix[i] = [i];
    }

    for(let j = 0; j <= a.length; j++){
        matrix[0][j] = j;
    }

    for(let i = 1; i <= b.length; i++){

        for(let j = 1; j <= a.length; j++){

            if(
                b.charAt(i - 1) ===
                a.charAt(j - 1)
            ){
                matrix[i][j] =
                    matrix[i - 1][j - 1];
            }
            else{

                matrix[i][j] =
                    Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );

            }

        }

    }

    return matrix[b.length][a.length];

}


function fuzzyWordMatch(
    messageWord,
    target
){

    const a =
        normalize(messageWord);

    const b =
        normalize(target);

    if(
        !a ||
        !b
    ){
        return false;
    }

    if(
        a.includes(b) ||
        b.includes(a)
    ){
        return true;
    }

    if(
        a.length < 5 ||
        b.length < 5
    ){
        return false;
    }

    const distance =
        levenshtein(a,b);

    const allowed =
        Math.max(
            1,
            Math.floor(
                Math.max(
                    a.length,
                    b.length
                ) / 5
            )
        );

    return distance <= allowed;

}


function fuzzyContains(
    text,
    targets
){

    const messageWords =
        words(text);

    return targets.some(
        target =>

            messageWords.some(
                messageWord =>
                    fuzzyWordMatch(
                        messageWord,
                        target
                    )
            )

    );

}


function matches(
    text,
    targets
){

    return (
        contains(
            text,
            targets
        )
        ||
        fuzzyContains(
            text,
            targets
        )
    );

}


/* =========================================================
   TERVEHDYKSET JA YLEISET ILMAUKSET
========================================================= */

function isGreeting(message){

    const clean =
        normalize(message);

    const greetings = [
        'hei',
        'moi',
        'moikka',
        'terve',
        'heippa',
        'moro',
        'morjens',
        'päivää',
        'paivaa',
        'hyvää päivää',
        'hyvaa paivaa'
    ];

    return greetings.some(
        greeting =>
            clean === normalize(greeting)
    );

}


function isThanks(message){

    return matches(
        message,
        [
            'kiitos',
            'kiitti',
            'kiitoksia',
            'thanks',
            'thx'
        ]
    );

}


function isYes(message){

    const clean =
        normalize(message);

    return [
        'kyllä',
        'kylla',
        'joo',
        'juu',
        'jep',
        'jes',
        'ok',
        'okei',
        'tottakai'
    ].includes(clean);

}


function isNo(message){

    const clean =
        normalize(message);

    return [
        'ei',
        'en',
        'eip',
        'eikä',
        'eika',
        'en tarvitse',
        'ei kiitos'
    ].includes(clean);

}


/* =========================================================
   HÄTÄTILANTEIDEN TUNNISTUS
========================================================= */

function detectEmergency(message){

    const m =
        normalize(message);

    const immediate = [
        'ei hengita',
        'hengitys pysahtynyt',
        'hengitys on pysahtynyt',
        'tajuton',
        'ei heraa',
        'ei reagoi',
        'eloton',
        'sydanpysahdys',
        'sydan pysahtyi',
        'runsas verenvuoto',
        'vakava verenvuoto',
        'verta tulee paljon',
        'tukehtuu',
        'tukehtuminen',
        'hukkuminen',
        'vakava onnettomuus',
        'hengenvaarassa'
    ];

    if(
        contains(
            m,
            immediate
        )
    ){
        return true;
    }


    /*
        Rintakipu ei yksin aina tarkoita hätätilannetta,
        joten etsitään myös vakavuuteen viittaavia sanoja.
    */

    if(
        contains(
            m,
            [
                'rintakipu',
                'rintaan sattuu',
                'puristaa rinnasta'
            ]
        )
        &&
        contains(
            m,
            [
                'kova',
                'voimakas',
                'yhtäkkiä',
                'yhtakkia',
                'hengitysvaikeus',
                'huimaa',
                'pyörryttää',
                'pyorryttaa',
                'kylmä hiki',
                'kylma hiki'
            ]
        )
    ){
        return true;
    }


    if(
        contains(
            m,
            [
                'halvaus',
                'aivohalvaus'
            ]
        )
    ){
        return true;
    }


    if(
        contains(
            m,
            [
                'en saa henkea',
                'en pysty hengittamaan',
                'vakava hengitysvaikeus',
                'hengitys todella vaikeaa'
            ]
        )
    ){
        return true;
    }


    return false;

}


/* =========================================================
   KOHDEHENKILÖN TUNNISTUS
========================================================= */

function detectAudience(message){

    if(
        matches(
            message,
            [
                'lapsi',
                'lapselle',
                'lapseni',
                'lapsella',
                'lasten',
                'vauva',
                'vauvalle',
                'vauvan',
                'taapero',
                'perhe',
                'perheelle',
                'lapsiperhe'
            ]
        )
    ){
        return 'family';
    }


    if(
        matches(
            message,
            [
                'nuori',
                'nuorelle',
                'nuorella',
                'nuoreni',
                'nuorten',
                'teini',
                'teini-ikäinen',
                'teini-ikainen',
                'opiskelija',
                'koululainen'
            ]
        )
    ){
        return 'family';
    }


    if(
        matches(
            message,
            [
                'ikääntynyt',
                'ikaantynyt',
                'ikäihminen',
                'ikaihminen',
                'vanhus',
                'seniori',
                'iäkäs',
                'iakas',
                'isoäiti',
                'isoaiti',
                'isoisä',
                'isoisa',
                'vanhemmalleni',
                'äidilleni',
                'aidilleni',
                'isälleni',
                'isalleni'
            ]
        )
    ){
        return 'senior';
    }


    if(
        matches(
            message,
            [
                'työikäinen',
                'tyoikainen',
                'työikäisten',
                'tyoikaisten',
                'aikuinen',
                'aikuiselle'
            ]
        )
    ){
        return 'working';
    }


    return null;

}


/* =========================================================
   AIHEEN TUNNISTUS
========================================================= */

function detectTopic(message){

    if(
        matches(
            message,
            [
                'mielenterveys',
                'mielenterveyspalvelu',
                'ahdistus',
                'ahdistaa',
                'masennus',
                'masentunut',
                'paniikki',
                'paniikkikohtaus',
                'jaksaminen',
                'en jaksa',
                'psykologi',
                'psykiatr',
                'terapia',
                'kriisi',
                'alakulo',
                'stressi',
                'uupumus'
            ]
        )
    ){
        return 'mental';
    }


    if(
        matches(
            message,
            [
                'päihde',
                'paihde',
                'alkoholi',
                'huume',
                'huumeet',
                'riippuvuus',
                'päihteet',
                'paihteet'
            ]
        )
    ){
        return 'substance';
    }


    if(
        matches(
            message,
            [
                'hammas',
                'hammashoito',
                'suun terveys',
                'hammassärky',
                'hammassarky',
                'hammaslääkäri',
                'hammaslaakari'
            ]
        )

    }


    if(

            [
                'rokote',
                'rokotus',
                'rokotukset',
                'influenssarokote',
                'jäykkäkouristus',
                'jaykkakouristus'
            ]

    if(

                'ehkaisy',
                'kondomi',
                'ehkäisypilleri',
                'ehkaisypilleri',
                'seksuaaliterveys',

            ]

    }


    if(

                'lomaketta',
                'lomakkeet',
                'kysely',
                'kaavake'
            ]

    if(

                'perhehoito'
            ]
        )
    ){
        return 'familycareform';
    }


    if(

                'kuntoutustutkimus',
                'seurantakysely',
                'kuntoutuksen seurantakysely',
                'kuntoutuspoliklinikka'
            ]
        )
    ){
        return 'rehabform';
    }


    if(
        matches(
            message,
            [
                'sosiaalipalvelu',
                'sosiaalityö',
                'sosiaalityo',
                'sosiaalityöntekijä',
                'sosiaalityontekija',
                'toimeentulo',
                'talousvaikeus',
                'rahaongelma',
                'asumisongelma',
                'palveluohjaus'
            ]
        )
    ){
        return 'social';
    }


    if(
        matches(
            message,
            [
                'lääkäri',
                'laakari',
                'sairaanhoitaja',
                'terveydenhoitaja',
                'terveysasema',
                'sairas',
                'oire',
                'kipu',
                'kuume',
                'yskä',
                'yska',
                'flunssa',
                'päänsärky',
                'paansarky',
                'vatsakipu',
                'selkäkipu',
                'selkakipu',
                'haava',
                'ihottuma',
                'terveys',
                'terveyspalvelu'
            ]
        )
    ){
        return 'health';
    }


    if(
        matches(
            message,
            [
                'ajanvaraus',
                'ajan varaaminen',
                'varata aika',
                'varaan ajan',
                'vastaanottoaika',
                'vastaanotolle'
            ]
        )
    ){
        return 'appointment';
    }


    if(
        matches(
            message,
            [
                'chat',
                'chatissa',
                'chatti',
                'keskustella ammattilaisen',
                'ammattilaiselle heti'
            ]
        )
    ){
        return 'chat';
    }


    if(
        matches(
            message,
            [
                'yhteydenotto',
                'yhteydenottopyyntö',
                'yhteydenottopyynto',
                'ottaa yhteyttä',
                'ottaa yhteytta',
                'yhteyttä',
                'yhteytta'
            ]
        )
    ){
        return 'contact';
    }


    return null;

}


/* =========================================================
   KIIREELLISYYDEN TUNNISTUS
========================================================= */

function detectUrgency(message){

    if(
        matches(
            message,
            [
                'heti',
                'nyt',
                'tänään',
                'tanaan',
                'samana päivänä',
                'samana paivana',
                'kiireellinen',
                'kiireesti',
                'nopeasti'
            ]
        )
    ){
        return 'same-day';
    }


    if(
        matches(
            message,
            [
                'ei kiire',
                'ei ole kiire',
                'kiireetön',
                'kiireeton',
                'myöhemmin',
                'myohemmin',
                'yhteydenottopyyntö',
                'yhteydenottopyynto'
            ]
        )
    ){
        return 'non-urgent';
    }


    return null;

}


/* =========================================================
   KESKUSTELUN KONTEKSTIN PÄIVITYS
========================================================= */

function updateContext(message){

    const audience =
        detectAudience(message);

    const topic =
        detectTopic(message);

    const urgency =
        detectUrgency(message);

    if(audience){
        botState.audience = audience;
    }

    if(topic){
        botState.topic = topic;
    }

    if(urgency){
        botState.urgency = urgency;
    }

    botState.lastUserMessage =
        message;

    botState.turns++;

}

   NÄKYMÄN AVAAMINEN BOTIN KAUTTA
========================================================= */

function openViewFromBot(view){

        );

/* =========================================================
   PALVELURYHMÄN NIMI
========================================================= */

function audienceName(audience){

    if(audience === 'family'){
        return 'lasten, nuorten ja perheiden';
    }

    if(audience === 'working'){
        return 'työikäisten';
    }

    if(audience === 'senior'){
        return 'ikääntyneiden';
    }

    return '';
}


/* =========================================================
   TARKENTAVA KYSYMYS
========================================================= */

function askUrgency(){

    botState.pendingQuestion =
        'urgency';

    return (
        'Selvä. Onko asia sellainen, että tarvitset yhteyden ammattilaiseen jo tänään, vai sopiiko kiireetön yhteydenottopyyntö?\n\n' +
        'Voit vastata esimerkiksi ”tänään” tai ”ei ole kiire”.'
    );

}


function askAudience(){

    botState.pendingQuestion =
        'audience';

    return (
        'Autan mielelläni. Kenelle palvelua etsit?\n\n' +
        'Voit vastata esimerkiksi: lapselle tai nuorelle, työikäiselle tai ikääntyneelle.'
    );

}


/* =========================================================
   AIEMMAN KYSYMYKSEN KÄSITTELY
========================================================= */

function handlePendingQuestion(message){

    if(
        botState.pendingQuestion ===
        'urgency'
    ){

        const urgency =
            detectUrgency(message);

        if(urgency){

            botState.urgency =
                urgency;

            botState.pendingQuestion =
                null;

            return buildServiceRecommendation();

        }

        if(isYes(message)){

            botState.urgency =
                'same-day';

            botState.pendingQuestion =
                null;

            return buildServiceRecommendation();

        }

        if(isNo(message)){

            botState.urgency =
                'non-urgent';

            botState.pendingQuestion =
                null;

            return buildServiceRecommendation();

        }

    }


    if(
        botState.pendingQuestion ===
        'audience'
    ){

        const audience =
            detectAudience(message);

        if(audience){

            botState.audience =
                audience;

            botState.pendingQuestion =
                null;

            if(
                !botState.urgency &&
                (
                    botState.topic === 'health' ||
                    botState.topic === 'mental' ||
                    botState.topic === 'social' ||
                    botState.topic === 'contact' ||
                    botState.topic === 'chat'
                )
            ){
                return askUrgency();
            }

            return buildServiceRecommendation();

        }

    }


    return null;

}


/* =========================================================
   PALVELUSUOSITUKSEN MUODOSTAMINEN
========================================================= */

function buildServiceRecommendation(){

    const audience =
        botState.audience;

    const topic =
        botState.topic;

    const urgency =
        botState.urgency;


    /*
        LOMAKKEET
    */

    if(
        topic === 'familycareform'
    ){

            'familycareform';

    }

        topic === 'rehabform'
    ){

            'Lomakkeet-näkymässä on ”Kuntoutustutkimuspoliklinikan SEURANTAKYSELY”. Se on tarkoitettu kuntoutustutkimuspoliklinikan jaksolla olleille.\n\n' +

            'Voit myös kertoa minulle, mitä lomaketta etsit, niin yritän tunnistaa sen.'
        );

    }


    /*
        MIELENTERVEYS / PÄIHTEET
    */

    if(
        topic === 'mental' ||
        topic === 'substance'
    ){

        if(!audience){
            return askAudience();
        }


        if(
            audience === 'working'
        ){

            if(!urgency){
                return askUrgency();
            }


            if(
                urgency ===
                'same-day'
            ){

                botState.lastIntent =
                    'working-chat';

                return (
                    'Koska tarvitset apua saman päivän aikana, Digiasioinnin työikäisten chat-palvelu on tilanteeseesi sopiva asiointitapa.\n\n' +
                    'Avaa vasemmalta Digiasiointi → Työikäiset → Työikäisten chatit.\n\n' +
                    'Jos tilanteeseen liittyy välitön hengen tai terveyden vaara, soita 112.'
                );

            }


            botState.lastIntent =
                'working-contact';

            return (
                'Työikäisten kiireettömässä yhteydenottopyynnössä on mielenterveys- ja päihdepalvelujen vaihtoehto.\n\n' +
                'Avaa Digiasiointi → Työikäiset → Työikäisten kiireetön yhteydenottopyyntö → Mielenterveys- ja päihdepalvelut.'
            );

        }


        if(
            audience === 'family'
        ){

            if(!urgency){
                return askUrgency();
            }


            if(
                urgency ===
                'same-day'
            ){

                botState.lastIntent =
                    'family-chat';

                return (
                    'Jos lapsen tai nuoren asia on tarpeen hoitaa saman päivän aikana, voit aloittaa Digiasioinnin lasten, nuorten ja perheiden chat-palveluista.\n\n' +
                    'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden chatit → Nuorten palveluohjaus.\n\n' +
                    'Jos tilanteessa on välitön hengen tai terveyden vaara, soita 112.'
                );

            }


            botState.lastIntent =
                'family-contact';

            return (
                'Kiireettömässä asiassa voit jättää yhteydenottopyynnön lasten, nuorten ja perheiden palveluihin.\n\n' +
                'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden kiireetön yhteydenottopyyntö → Nuorten palvelut.'
            );

        }

    }


    /*
        SOSIAALIPALVELUT
    */

    if(
        topic === 'social'
    ){

        if(!audience){
            return askAudience();
        }


        if(!urgency){
            return askUrgency();
        }


        if(
            audience === 'working'
        ){

            if(
                urgency ===
                'same-day'
            ){

                botState.lastIntent =
                    'working-chat';

                return (
                    'Jos työikäisen sosiaali- tai palveluohjauksen asia pitäisi hoitaa saman päivän aikana, voit käyttää työikäisten chat-palvelua.\n\n' +
                    'Avaa Digiasiointi → Työikäiset → Työikäisten chatit → Työikäisten palveluohjaus.'
                );

            }


            botState.lastIntent =
                'working-contact';

            return (
                'Kiireettömässä asiassa voit jättää yhteydenottopyynnön sosiaali- ja terveyspalvelujen ohjaukseen.\n\n' +
                'Avaa Digiasiointi → Työikäiset → Työikäisten kiireetön yhteydenottopyyntö → Sosiaali- ja terveyspalvelujen ohjaus.'
            );

        }


        if(
            audience === 'senior'
        ){

            if(
                urgency ===
                'same-day'
            ){

                botState.lastIntent =
                    'senior-chat';

                return (
                    'Ikääntyneiden palveluihin liittyvässä asiassa voit käyttää Seniorineuvonnan chatia tai ikääntyneiden palveluohjausta.\n\n' +
                    'Avaa Digiasiointi → Ikääntyneet → Ikääntyneiden chatit.'
                );

            }


            botState.lastIntent =
                'senior-contact';

            return (
                'Kiireettömässä asiassa voit jättää yhteydenottopyynnön Seniorineuvontaan tai ikääntyneiden palveluohjaukseen.\n\n' +
                'Avaa Digiasiointi → Ikääntyneet → Ikääntyneiden kiireetön yhteydenottopyyntö.'
            );

        }


        if(
            audience === 'family'
        ){

            if(
                urgency ===
                'same-day'
            ){

                botState.lastIntent =
                    'family-chat';

                return (
                    'Jos lapsen, nuoren tai perheen asia pitäisi hoitaa saman päivän aikana, voit käyttää lasten, nuorten ja perheiden chat-palveluita.\n\n' +
                    'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden chatit.'
                );

            }


            botState.lastIntent =
                'family-contact';

            return (
                'Kiireettömässä asiassa voit jättää yhteydenottopyynnön lapsiperheiden sosiaalipalveluihin tai nuorten palveluihin.\n\n' +
                'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden kiireetön yhteydenottopyyntö.'
            );

        }

    }


    /*
        YLEINEN TERVEYSASIA
    */

    if(
        topic === 'health'
    ){

        if(!audience){
            return askAudience();
        }


        if(!urgency){
            return askUrgency();
        }


        if(
            audience === 'working'
        ){

            if(
                urgency ===
                'same-day'
            ){

                botState.lastIntent =
                    'working-chat';

                return (
                    'Jos terveysasia pitäisi arvioida saman päivän aikana eikä kyse ole hätätilanteesta, voit aloittaa työikäisten Terveyspalvelujen chatista.\n\n' +
                    'Avaa Digiasiointi → Työikäiset → Työikäisten chatit → Terveyspalvelujen chat.\n\n' +
                    'Hätätilanteessa soita 112.'
                );

            }


            botState.lastIntent =
                'working-contact';

            return (
                'Kiireettömässä terveysasiassa voit jättää yhteydenottopyynnön terveyspalveluihin.\n\n' +
                'Avaa Digiasiointi → Työikäiset → Työikäisten kiireetön yhteydenottopyyntö → Terveyspalvelut.'
            );

        }


        if(
            audience === 'family'
        ){

            if(
                urgency ===
                'same-day'
            ){

                return (
                    'Jos lapsen tai nuoren asia pitäisi hoitaa saman päivän aikana, voit aloittaa lasten, nuorten ja perheiden chat-palveluista.\n\n' +
                    'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden chatit.\n\n' +
                    'Jos kyse on vakavasta tai nopeasti pahenevasta tilanteesta, hakeudu kiireelliseen arvioon. Hätätilanteessa soita 112.'
                );

            }


            return (
                'Kiireettömässä lapsen tai nuoren asiassa voit aloittaa lasten, nuorten ja perheiden kiireettömästä yhteydenottopyynnöstä.\n\n' +
                'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden kiireetön yhteydenottopyyntö.'
            );

        }


        if(
            audience === 'senior'
        ){

            if(
                urgency ===
                'same-day'
            ){

                return (
                    'Jos ikääntyneen asia pitäisi hoitaa saman päivän aikana, voit aloittaa ikääntyneiden chat-palveluista.\n\n' +

                );

            }


            return (
                'Kiireettömässä asiassa voit aloittaa ikääntyneiden kiireettömästä yhteydenottopyynnöstä.\n\n' +
                'Avaa Digiasiointi → Ikääntyneet → Ikääntyneiden kiireetön yhteydenottopyyntö.'
            );

        }

    }


    /*
        PELKKÄ CHAT- TAI YHTEYDENOTTOPYYNTÖ
    */

    if(
        topic === 'chat' ||
        urgency === 'same-day'
    ){

        if(!audience){
            return askAudience();
        }


        if(
            audience === 'family'
        ){

            return (
                'Avaa Digiasiointi → Lapset, nuoret ja perheet → Lasten, nuorten ja perheiden chatit.\n\n' +
                'Chat on tarkoitettu asioihin, jotka on tarpeen hoitaa saman päivän aikana.'
            );

        }


        if(
            audience === 'working'
        ){

            return (
                'Avaa Digiasiointi → Työikäiset → Työikäisten chatit.\n\n' +
                'Voit valita siellä työikäisten palveluohjauksen tai terveyspalvelujen chatin.'
            );

        }


        if(
            audience === 'senior'
        ){

            return (
                'Avaa Digiasiointi → Ikääntyneet → Ikääntyneiden chatit.\n\n' +
                'Voit valita Seniorineuvonnan chatin tai ikääntyneiden palveluohjauksen.'
            );

    }


    if(
        topic === 'contact' ||
        urgency === 'non-urgent'
    ){

        if(!audience){
            return askAudience();
        }


        return (
            'Voit jättää kiireettömän yhteydenottopyynnön ' +
            audienceName(audience) +

            (
                audience === 'family'
                    ? 'Lapset, nuoret ja perheet.'
                    :
                audience === 'working'
                    ? 'Työikäiset.'
                    :
                'Ikääntyneet.'
            )
        );

    }


    /*
        PELKKÄ KOHDEHENKILÖ
    */

    if(audience){

        if(
            audience === 'family'
        ){

            return (
                'Lasten, nuorten ja perheiden palveluissa voit joko jättää kiireettömän yhteydenottopyynnön tai keskustella ammattilaisen kanssa chatissa.\n\n' +
                'Millaiseen asiaan tarvitset apua? Voit kertoa tilanteesta omin sanoin.'
            );

            audience === 'working'
        ){

                'Kerro vielä, mihin asiaan tarvitset apua – esimerkiksi terveysasiaan, mielenterveyteen, päihteisiin tai palveluohjaukseen.'
            );

        }


        if(
            audience === 'senior'
        ){

            return (

                'Kerro vielä lyhyesti, millaisessa asiassa tarvitset apua.'
            );

        }

    }


    return null;

}


/* =========================================================
   ERITYISKYSYMYKSET
========================================================= */

function specialReply(message){

    /*
        Mitä botti osaa?
    */

    if(
        matches(
            message,
            [
                'mitä osaat',
                'mita osaat',
                'miten voit auttaa',
                'missä voit auttaa',
                'missa voit auttaa',
                'mitä voin kysyä',
                'mita voin kysya'
            ]
        )
    ){

        return (
            'Voin auttaa erityisesti palvelun löytämisessä.\n\n' +
            'Voit kertoa minulle esimerkiksi:\n' +
            '• kenelle palvelua etsit\n' +
            '• millaisesta terveys- tai sosiaalipalvelun asiasta on kyse\n' +
            '• tarvitsetko apua tänään vai onko asia kiireetön\n' +
            '• mitä lomaketta etsit\n\n' +
            'Sinun ei tarvitse tietää palvelun virallista nimeä.'
        );

    }


    /*
        Hätätilanne / 112
    */

    if(
        matches(
            message,
            [
                '112',
                'hätänumero',
                'hatanumero',
                'milloin soitan 112',
                'milloin soittaa 112'
            ]
        )
    ){

        return (
            'Soita hätänumeroon 112, kun henki, terveys, omaisuus tai ympäristö on välittömässä vaarassa tai on syytä epäillä näin olevan.\n\n' +
            'Jos kyseessä on käynnissä oleva hätätilanne, älä jää odottamaan vastausta chatissa.'
        );

    }


    /*
        Ajanvaraus
    */

    if(
        botState.topic ===
        'appointment'
    ){

        return (
            'Tämän chat-botin tehtävänä on palveluohjaus, eikä se voi tehdä ajanvarausta puolestasi.\n\n' +
            'Voin kuitenkin auttaa selvittämään, minkä palvelun kautta asia kannattaa aloittaa. Kerro esimerkiksi kenelle aika olisi tulossa ja mihin asiaan tarvitset vastaanottoa.'
        );

    }


    /*
        Rokotus
    */

    if(
        botState.topic ===
        'vaccination'
    ){

        return (
            'Rokotuksiin liittyvissä asioissa oikea asiointikanava riippuu esimerkiksi iästäsi ja siitä, mistä rokotuksesta on kyse.\n\n' +
            'Kerro vielä, onko kyse esimerkiksi influenssarokotuksesta, muusta rokotuksesta tai rokotustietojen tarkistamisesta, niin voin ohjata asiaa tarkemmin.'
        );

    }


    /*
        Seksuaaliterveys / ehkäisy
    */

    if(
        botState.topic ===
        'sexual'
    ){

        return (
            'Seksuaaliterveyteen, ehkäisyyn tai raskauteen liittyvissä asioissa palvelu riippuu tilanteesta ja iästä.\n\n' +
            'Voit kertoa hieman tarkemmin, tarvitsetko esimerkiksi ehkäisyneuvontaa, raskaustestiin liittyvää neuvontaa vai muuta palveluohjausta. Älä kirjoita henkilötunnusta tai muita tarpeettomia arkaluonteisia henkilötietoja.'
        );

    }


    /*
        Hammashoito
    */

    if(
        botState.topic ===
        'dental'
    ){

        return (
            'Suun terveydenhuollon asia tunnistettu. Tämän sivun Digiasiointi-näkymässä ei tällä hetkellä ole erillistä hammashoidon palvelua, joten en halua ohjata sinua väärään asiointikanavaan.\n\n' +
            'Jos kerrot, onko kyse esimerkiksi hammassärystä, ajanvarauksesta vai muusta suun terveyden asiasta, voin antaa yleistä palveluohjausta.'
        );

    }


    return null;

}


/* =========================================================
   PÄÄVASTAUSLOGIIKKA
========================================================= */

function botReply(text){

    const message =
        normalize(text);


    /*
        Tyhjä viesti
    */

    if(!message){

        return (
            'Kirjoita viesti, niin yritän auttaa löytämään oikean palvelun.'
        );

    }


    /*
        Hätätilanne tarkistetaan AINA ensimmäisenä.
    */

    if(
        detectEmergency(message)
    ){

        botState.lastIntent =
            'emergency';

        botState.pendingQuestion =
            null;

        return (
            'Tilanne voi vaatia välitöntä apua.\n\n' +
            'Soita hätänumeroon 112. Älä jää odottamaan vastausta chatissa.\n\n' +
            'Jos olet toisen henkilön luona, pysy hänen luonaan ja noudata hätäkeskuksen antamia ohjeita.'
        );

    }


    /*
        Tervehdys
    */

    if(
        isGreeting(message)
    ){

        return (
            'Hei! 👋 Miten voin auttaa?\n\n' +
            'Voit kertoa tilanteestasi aivan omin sanoin. Esimerkiksi ”tarvitsen apua nuoren mielenterveysasiassa” tai ”haluan jättää kiireettömän yhteydenottopyynnön”.'
        );

    }


    /*
        Kiitos
    */

    if(
        isThanks(message)
    ){

        return (
            'Ole hyvä! Voit jatkaa kysymällä myös toisesta palvelusta tai kertomalla uuden tilanteen.'
        );

    }


    /*
        Jos botti kysyi edellisessä viestissä jotakin,
        yritetään tulkita vastaus keskustelun kontekstissa.
    */

    const pendingReply =
        handlePendingQuestion(message);

    if(pendingReply){

        return pendingReply;

    }


    /*
        Päivitetään keskustelun muisti.
    */

    updateContext(message);


    /*
        Erityiskysymykset
    */

    const special =
        specialReply(message);

    if(special){

        return special;

    }


    /*
        Normaali palveluohjaus
    */

    const recommendation =
        buildServiceRecommendation();

    if(recommendation){

        return recommendation;

    }


    /*
        "Missä palvelut ovat?"
    */

    if(
        matches(
            message,
            [
                'digiasiointi',
                'digipalvelu',
                'digitaaliset palvelut',
                'palvelut',
                'mistä löydän palvelut',
                'mista loydan palvelut'
            ]
        )
    ){

        return (
            'Digiasiointi löytyy vasemman reunan valikosta.\n\n' +
            'Siellä palvelut on jaettu kolmeen ryhmään:\n' +
            '• Lapset, nuoret ja perheet\n' +
            '• Työikäiset\n' +
            '• Ikääntyneet\n\n' +
            'Jokaisessa ryhmässä voit tarkastella käytettävissä olevia yhteydenottopyyntöjä ja chat-palveluita.'
        );

    }


    /*
        Jos viestistä tunnistetaan kysymysmuoto,
        mutta ei aihetta, botti ei vain sano "en ymmärrä",
        vaan yrittää kerätä olennaisen tiedon.
    */

    if(
        contains(
            message,
            [
                'mihin',
                'mistä',
                'mista',
                'miten',
                'minne',
                'kuka',
                'kenelle',
                'voinko',
                'saanko',
                'tarvitsen',
                'haluan',
                'etsin'
            ]
        )
    ){

        botState.pendingQuestion =
            'audience';

        return (
            'Yritän löytää sinulle oikean palvelun. Kenelle palvelua etsit?\n\n' +
            'Voit vastata esimerkiksi ”nuorelle”, ”itselleni / työikäiselle” tai ”ikääntyneelle”. Sen jälkeen voin tarkentaa sopivaa asiointikanavaa.'
        );

    }


    /*
        Viimeinen fallback.

        Tarkoituksella huomattavasti hyödyllisempi
        kuin vanhan botin "en löytänyt vastausta".
    */

    return (
        'En saanut vielä riittävästi tietoa oikean palvelun valitsemiseksi, mutta voimme selvittää sen yhdessä.\n\n' +
        'Kerro lyhyesti:\n' +
        '1. kenelle palvelua etsit ja\n' +
        '2. millaisesta asiasta on kyse.\n\n' +
        'Voit kirjoittaa esimerkiksi: ”16-vuotias nuori tarvitsee apua mielenterveysasiassa” tai ”etsin työikäiselle kiireetöntä terveyspalvelua”.'
    );

}


/* =========================================================
   VIESTIN LÄHETYS
========================================================= */

function sendBotMessage(text){

    const clean =
        text.trim();

    if(!clean){
        return;
    }

    ensureBotStarted();

    addMessage(
        clean,
        'user'
    );

    botInput.value = '';
    botInput.style.height = 'auto';


    /*
        Pieni kirjoitusviive tekee keskustelusta
        luonnollisemman tuntuisen.
    */

    const delay =
        380 +
        Math.min(
            clean.length * 3,
            420
        );


    setTimeout(
        () => {

            const reply =
                botReply(clean);

            addMessage(
                reply,
                'bot'
            );

        },
        delay
    );

}


/* =========================================================
   LOMAKKEEN LÄHETYS
========================================================= */

botForm.addEventListener(
    'submit',
    event => {

        event.preventDefault();

        sendBotMessage(
            botInput.value
        );

    }
);


/* =========================================================
   ENTER = LÄHETÄ
   SHIFT + ENTER = UUSI RIVI
========================================================= */

botInput.addEventListener(
    'keydown',
    event => {

        if(
            event.key === 'Enter'
            &&
            !event.shiftKey
        ){

            event.preventDefault();

            botForm.requestSubmit();

        }

    }
);


/* =========================================================
   TEKSTIKENTÄN AUTOMAATTINEN KORKEUS
========================================================= */

botInput.addEventListener(
    'input',
    () => {

        botInput.style.height =
            'auto';

        botInput.style.height =
            Math.min(
                botInput.scrollHeight,
                110
            ) + 'px';

    }
);


/* =========================================================
   PIKAVALINNAT
========================================================= */

document
    .querySelectorAll('.quick')
    .forEach(button => {

        button.addEventListener(
            'click',
            () => {

                sendBotMessage(
                    button.dataset.message
                );

            }
        );

    });

/* =========================================================
   CLOSE OVERLAYS WITH ESC
========================================================= */

document.addEventListener(
    'keydown',
    event => {

        if(event.key !== 'Escape'){
            return;
        }

        drawerOverlay.classList.remove('open');
        videoModal.classList.remove('open');
        formModal.classList.remove('open');

    }
);

</script>

</body>
</html>
